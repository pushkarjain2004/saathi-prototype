<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Saathi by YourDOST</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: a phone-sized app in the centre, a "behind the scenes" panel for reviewers beside it (bottom drawer on phones). */
:root {
  --bg: #eef3f2; --surface: #ffffff; --surface-2: #f4f8f7; --line: #dbe5e3;
  --fg: #14302e; --sub: #4d6663; --mute: #7f9693;
  --accent: #0f766e; --accent-2: #115e59; --accent-soft: #dff2ef;
  --navy: #12324a;
  --warn: #b45309; --warn-soft: #fff4e0;
  --help: #c2410c; --help-soft: #fdece4;
  --ok: #15803d; --ok-soft: #e4f5e9;
  --code-bg: #0f2422; --code-fg: #cfe8e4;
  --shadow: 0 10px 40px rgba(18, 50, 74, .12);
  --f-head: "Manrope", "Segoe UI", system-ui, sans-serif;
  --f-body: "Inter", "Segoe UI", system-ui, sans-serif;
  --f-mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0b1615; --surface: #12211f; --surface-2: #172a28; --line: #24403c;
  --fg: #e3f0ee; --sub: #a5bfbb; --mute: #7a9692;
  --accent: #2dd4bf; --accent-2: #5eead4; --accent-soft: #123b37;
  --navy: #9cc3e0;
  --warn: #fbbf24; --warn-soft: #33260c;
  --help: #fb923c; --help-soft: #3a1e10;
  --ok: #4ade80; --ok-soft: #10301b;
  --code-bg: #060d0c; --code-fg: #cfe8e4;
  --shadow: 0 10px 40px rgba(0,0,0,.4);
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0b1615; --surface: #12211f; --surface-2: #172a28; --line: #24403c;
  --fg: #e3f0ee; --sub: #a5bfbb; --mute: #7a9692;
  --accent: #2dd4bf; --accent-2: #5eead4; --accent-soft: #123b37;
  --navy: #9cc3e0;
  --warn: #fbbf24; --warn-soft: #33260c;
  --help: #fb923c; --help-soft: #3a1e10;
  --ok: #4ade80; --ok-soft: #10301b;
  --code-bg: #060d0c; --code-fg: #cfe8e4;
  --shadow: 0 10px 40px rgba(0,0,0,.4);
  color-scheme: dark; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.5; margin: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3, h4 { font-family: var(--f-head); margin: 0; text-wrap: balance; color: var(--fg); }
button { font: inherit; cursor: pointer; color: inherit; }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
a { color: var(--accent); }

/* Demo bar */
.demobar { max-width: 1180px; margin: 0 auto; padding-block: 14px 10px; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; }
.brand { display: flex; align-items: baseline; gap: 10px; }
.brand b { font-family: var(--f-head); font-size: 18px; color: var(--navy); }
.brand span { font-size: 12.5px; color: var(--sub); }
.personas { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.personas small { font-size: 12px; color: var(--sub); margin-right: 2px; }
.pbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 13px; display: flex; gap: 6px; align-items: center; }
.pbtn[aria-pressed="true"] { background: var(--navy); color: var(--surface); border-color: var(--navy); }
.pbtn .av { width: 20px; height: 20px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 11px; font-weight: 700; background: var(--accent-soft); color: var(--accent-2); }
.pbtn[aria-pressed="true"] .av { background: var(--accent); color: #fff; }
.toolbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 10px; font-size: 13px; }

/* Stage */
.stage { max-width: 1180px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 420px) minmax(0, 1fr); gap: 24px; align-items: start; padding-block: 0 32px; }
.stage.nopanel { grid-template-columns: minmax(0, 420px); justify-content: center; }

/* Phone */
.phone { background: var(--surface); border-radius: 28px; box-shadow: var(--shadow); border: 1px solid var(--line); overflow: hidden; display: flex; flex-direction: column; height: min(820px, calc(100vh - 90px)); min-height: 600px; position: relative; }
.appbar { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px 10px; border-bottom: 1px solid var(--line); }
.appbar .logo { font-family: var(--f-head); font-weight: 800; font-size: 16px; color: var(--navy); }
.appbar .logo i { font-style: normal; color: var(--accent); }
.appbar .dayp { font-size: 12px; color: var(--sub); background: var(--surface-2); padding: 3px 9px; border-radius: 999px; }
.screen { flex: 1; overflow-y: auto; padding: 18px 18px 24px; display: flex; flex-direction: column; gap: 14px; }
.nav { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--line); background: var(--surface); }
.nav button { background: none; border: 0; padding: 9px 2px 11px; font-size: 11.5px; color: var(--sub); display: flex; flex-direction: column; align-items: center; gap: 3px; }
.nav button svg { width: 20px; height: 20px; }
.nav button[aria-current="page"] { color: var(--accent); font-weight: 600; }
.nav button.helpnav { color: var(--help); }

/* Common blocks */
.hello h1 { font-size: 22px; }
.hello p { margin: 2px 0 0; color: var(--sub); font-size: 14px; }
.eyebrow { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; color: var(--accent); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.card.soft { background: var(--surface-2); border-color: transparent; }
.card.saathi { background: linear-gradient(160deg, var(--accent-soft), var(--surface) 75%); border-color: var(--accent-soft); }
.card h2 { font-size: 18px; line-height: 1.3; }
.card h3 { font-size: 15.5px; }
.card p { margin: 0; color: var(--sub); font-size: 14px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.between { justify-content: space-between; }
.btn { border: 0; border-radius: 12px; padding: 11px 16px; font-weight: 600; font-size: 14.5px; background: var(--accent); color: #fff; }
:root[data-theme="dark"] .btn { color: #062320; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn { color: #062320; } }
.btn.block { width: 100%; }
.btn.ghost { background: transparent; color: var(--accent); border: 1px solid var(--line); }
.btn.help { background: var(--help); color: #fff; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.link { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 600; font-size: 14px; text-decoration: underline; text-underline-offset: 3px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 13.5px; }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-2); font-weight: 600; }
.tag { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 5px 6px 5px 12px; font-size: 13.5px; background: var(--accent-soft); color: var(--accent-2); font-weight: 600; }
.tag button { border: 0; background: transparent; width: 22px; height: 22px; border-radius: 50%; font-size: 14px; line-height: 1; color: var(--accent-2); }
.tag button:hover { background: var(--surface); }
.pill { display: inline-block; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--sub); }
.pill.t-video { background: #e6effd; color: #1d4ed8; } .pill.t-article { background: #f1ebfd; color: #6d28d9; }
.pill.t-exercise { background: var(--ok-soft); color: var(--ok); } .pill.t-assessment { background: var(--warn-soft); color: var(--warn); }
.pill.t-program { background: var(--accent-soft); color: var(--accent-2); } .pill.t-chat, .pill.t-session { background: var(--help-soft); color: var(--help); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .pill.t-video { background:#14264a; color:#93b4f5 } :root:not([data-theme="light"]) .pill.t-article { background:#2a1c47; color:#c4a8f5 } }
:root[data-theme="dark"] .pill.t-video { background:#14264a; color:#93b4f5 } :root[data-theme="dark"] .pill.t-article { background:#2a1c47; color:#c4a8f5 }
textarea, input[type="text"], input[type="password"], select { width: 100%; border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; font: inherit; background: var(--surface); color: var(--fg); }
textarea { min-height: 96px; resize: vertical; }
label.q { font-weight: 600; font-size: 14px; color: var(--fg); }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.seg button { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 4px; font-size: 13px; }
.seg button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-2); font-weight: 600; }
.note { font-size: 12.5px; color: var(--sub); display: flex; gap: 8px; align-items: flex-start; }
.note svg { flex: none; width: 15px; height: 15px; margin-top: 2px; color: var(--accent); }
.banner { border-radius: 12px; padding: 12px 14px; font-size: 14px; display: flex; flex-direction: column; gap: 8px; }
.banner.warn { background: var(--warn-soft); color: var(--fg); border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent); }
.banner.help { background: var(--help-soft); border: 1px solid color-mix(in srgb, var(--help) 35%, transparent); }
.banner.ok { background: var(--ok-soft); }
.back { align-self: flex-start; background: none; border: 0; color: var(--sub); font-size: 13.5px; padding: 0; }
.opt { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 11px 14px; font-size: 14.5px; width: 100%; }
.opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
.stack { display: flex; flex-direction: column; gap: 8px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tile { border: 1px solid var(--line); border-radius: 12px; padding: 10px 6px; text-align: center; font-size: 12.5px; color: var(--sub); background: var(--surface); }
.tile b { display: block; font-size: 18px; margin-bottom: 2px; }
.muted { color: var(--sub); }
.small { font-size: 12.5px; }

/* Recommendation */
.rec-main { border: 2px solid var(--accent); }
.rec-main h2 { font-size: 19px; }
.why { background: var(--surface-2); border-radius: 10px; padding: 9px 12px; font-size: 13.5px; color: var(--fg); }
.why b { color: var(--accent-2); }
.rec-alt { flex-direction: row; align-items: center; gap: 12px; padding: 12px 14px; text-align: left; width: 100%; }
.rec-alt .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.rec-alt .txt b { font-size: 14.5px; font-family: var(--f-head); }
.rec-alt .txt span { font-size: 12.5px; color: var(--sub); }
.chev { color: var(--mute); font-size: 20px; }

/* Doing */
.player { aspect-ratio: 16/9; max-width: 100%; border-radius: 14px; background: linear-gradient(135deg, #12324a, #0f766e); display: grid; place-items: center; position: relative; overflow: hidden; color: #fff; }
.player .playb { width: 58px; height: 58px; border-radius: 50%; border: 0; background: rgba(255,255,255,.92); color: #12324a; font-size: 22px; }
.player .bar { position: absolute; left: 12px; right: 12px; bottom: 12px; height: 5px; background: rgba(255,255,255,.3); border-radius: 3px; }
.player .bar i { display: block; height: 100%; width: 0; background: #fff; border-radius: 3px; transition: width .3s linear; }
.player .cap { position: absolute; left: 14px; top: 12px; font-size: 12px; opacity: .85; }
.breath { width: 150px; height: 150px; border-radius: 50%; margin: 8px auto; background: radial-gradient(circle, var(--accent-soft), var(--accent)); display: grid; place-items: center; color: #fff; font-weight: 700; font-family: var(--f-head); animation: breathe 16s ease-in-out infinite; }
@keyframes breathe { 0%,100% { transform: scale(.7) } 25%, 50% { transform: scale(1) } 75% { transform: scale(.7) } }
@media (prefers-reduced-motion: reduce) { .breath { animation: none; } }
.article p { color: var(--fg); font-size: 14.5px; }
.slot { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; background: var(--surface); font-size: 13.5px; }
.slot[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
.bubble { background: var(--surface-2); border-radius: 14px 14px 14px 4px; padding: 10px 12px; font-size: 14px; max-width: 88%; }
.bubble.me { align-self: flex-end; background: var(--accent-soft); border-radius: 14px 14px 4px 14px; }
.toggle { display: flex; gap: 10px; align-items: flex-start; font-size: 13.5px; }
.toggle input { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--accent); flex: none; }

/* Journey */
.tl { display: flex; flex-direction: column; gap: 0; }
.tl .ev { display: grid; grid-template-columns: 22px 1fr; gap: 10px; padding-bottom: 14px; position: relative; }
.tl .ev::before { content: ""; position: absolute; left: 10px; top: 20px; bottom: 0; width: 2px; background: var(--line); }
.tl .ev:last-child::before { display: none; }
.tl .dot { width: 22px; height: 22px; border-radius: 50%; background: var(--accent-soft); border: 2px solid var(--accent); }
.tl .dot.h { background: var(--help-soft); border-color: var(--help); }
.tl .ev b { font-size: 14px; display: block; }
.tl .ev span { font-size: 12.5px; color: var(--sub); }

/* Crisis */
.crisis h1 { font-size: 22px; }
.helpline { display: flex; justify-content: space-between; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.helpline b { font-family: var(--f-head); font-size: 20px; letter-spacing: .02em; user-select: all; }
.helpline span { font-size: 12.5px; color: var(--sub); display: block; }

/* Loader */
.loading { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; flex: 1; color: var(--sub); }
.spin { width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--accent-soft); border-top-color: var(--accent); animation: sp 0.9s linear infinite; }
@keyframes sp { to { transform: rotate(360deg) } }
.toast { position: absolute; left: 16px; right: 16px; bottom: 74px; background: var(--navy); color: var(--surface); padding: 10px 14px; border-radius: 12px; font-size: 13.5px; box-shadow: var(--shadow); }

/* Reviewer panel */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; display: flex; flex-direction: column; height: min(820px, calc(100vh - 90px)); min-height: 600px; overflow: hidden; }
.panel header { padding: 14px 18px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 10px; align-items: center; }
.panel header h2 { font-size: 16px; }
.panel header p { margin: 0; font-size: 12.5px; color: var(--sub); }
.pbody { overflow-y: auto; padding: 14px 18px 22px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.psec { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.psec h3 { font-size: 13px; letter-spacing: .04em; text-transform: uppercase; color: var(--sub); }
.psec .who { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; text-transform: uppercase; letter-spacing: .05em; }
.who.ai { background: #f1ebfd; color: #6d28d9; } .who.rule { background: var(--surface-2); color: var(--sub); } .who.human { background: var(--help-soft); color: var(--help); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .who.ai { background:#2a1c47; color:#c4a8f5 } }
:root[data-theme="dark"] .who.ai { background:#2a1c47; color:#c4a8f5 }
.step { display: grid; grid-template-columns: 26px 1fr; gap: 10px; min-width: 0; }
.step .n { width: 26px; height: 26px; border-radius: 8px; background: var(--navy); color: var(--surface); font-size: 12px; font-weight: 700; display: grid; place-items: center; }
.step .c { min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.step .c > div:first-child { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.step .c b { font-size: 14px; }
.step .c p { margin: 0; font-size: 13px; color: var(--sub); }
pre.code { background: var(--code-bg); color: var(--code-fg); font-family: var(--f-mono); font-size: 11.5px; padding: 10px 12px; border-radius: 10px; margin: 0; overflow-x: auto; white-space: pre-wrap; word-break: break-word; max-height: 240px; }
.tbl { overflow-x: auto; }
.tbl table { border-collapse: collapse; width: 100%; font-size: 12px; font-variant-numeric: tabular-nums; }
.tbl th, .tbl td { text-align: left; padding: 5px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl th { color: var(--sub); font-weight: 600; }
.tbl tr.top td { font-weight: 700; color: var(--accent-2); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 13px; }
.kv dt { color: var(--sub); } .kv dd { margin: 0; }
.empty { font-size: 13px; color: var(--sub); }
.ok-t { color: var(--ok); font-weight: 600; } .warn-t { color: var(--warn); font-weight: 600; } .help-t { color: var(--help); font-weight: 600; }

@media (max-width: 600px) { .pbtn .muted { display: none; } .brand span { display: none; } }
@media (max-width: 860px) {
  .stage { grid-template-columns: minmax(0, 1fr); }
  .phone { height: calc(100vh - 120px); min-height: 560px; border-radius: 22px; }
  .panel { position: fixed; left: 0; right: 0; bottom: 0; height: 78vh; min-height: 0; z-index: 20; border-radius: 18px 18px 0 0; box-shadow: var(--shadow);
    padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
}
</style>
</head>
<body>


<div class="demobar">
  <div class="brand"><b>Saathi</b><span>YourDOST prototype · all people and data are fictional</span></div>
  <div class="personas" id="personas"></div>
  <div class="row">
    <button class="toolbtn" id="panelBtn" aria-expanded="true">Behind the scenes</button>
    <button class="toolbtn" id="resetBtn">Reset demo</button>
  </div>
</div>
<div class="stage" id="stage">
  <section class="phone" aria-label="Saathi app">
    <div class="appbar"><span class="logo">YourDOST · <i>Saathi</i></span><span class="dayp" id="dayp"></span></div>
    <main class="screen" id="screen"></main>
    <div id="toastHost"></div>
    <nav class="nav" id="nav"></nav>
  </section>
  <aside class="panel" id="panel" aria-label="Behind the scenes"></aside>
</div>

<script>
/* ================= DATA (all fictional) ================= */
const THEMES = {
  work_stress: "Work stress", sleep: "Poor sleep", anxiety: "Anxiety / worry", low_mood: "Feeling low",
  burnout: "Burnout", loneliness: "Loneliness", relationships: "Relationships", anger: "Anger / irritability",
  exam_stress: "Exam stress", focus: "Focus", grief: "Grief / loss", self_esteem: "Self-confidence",
  smoking: "Smoking", parenting: "Parenting"
};
const DURATION = { days: "A few days", weeks: "A few weeks", months: "Months or more", unknown: "Not sure" };
const SEVERITY = { mild: "A little", moderate: "Quite a bit", high: "A lot" };
const TYPE_LABEL = { video: "Video", article: "Article", exercise: "Exercise", assessment: "Self-check", program: "Program", chat: "Instant chat", session: "Session" };
const LEVEL = { video: 1, article: 1, exercise: 1, assessment: 2, program: 2, chat: 3, session: 3 };
const FORMAT = { video: "watch", article: "read", exercise: "do", assessment: "do", program: "do", chat: "talk", session: "talk" };

const CATALOGUE = [
  { id: "v1", type: "video", title: "Wind-down for better sleep", mins: 10, themes: ["sleep"], desc: "A guided routine to slow your body and mind before bed." },
  { id: "v3", type: "video", title: "Switching off after work", mins: 8, themes: ["work_stress", "burnout"], desc: "Simple ways to leave work at work, even when you work from home." },
  { id: "v4", type: "video", title: "Grounding when your mind races", mins: 6, themes: ["anxiety"], desc: "The 5-4-3-2-1 method to bring yourself back to the present." },
  { id: "v5", type: "video", title: "Cooling down before you snap", mins: 7, themes: ["anger", "relationships", "parenting"], desc: "Notice the early signs of anger and buy yourself a pause." },

// 1. Privacy filter: runs in the browser before any AI sees the text.
function redact(text, p) {

  t = t.replace(/\b([Mm]y|[Oo]ur)\s+(new\s+)?(manager|boss|lead|team lead|friend|wife|husband|partner|colleague|roommate|mother|father|sister|brother)\s+([A-Z][a-z]+)/g,

  t = t.replace(/\b([A-Z][A-Za-z]+(\s[A-Z][A-Za-z]+)*)\s(Pvt\.?\s?Ltd|Ltd|Inc|Technologies|Solutions|Corp|LLP)\b\.?/g, m => { removed.push({ kind: "company", value: m }); return "[COMPANY]"; });

const CHIP_THEME = { "Stressed": "work_stress", "Can't sleep": "sleep", "Anxious": "anxiety", "Low": "low_mood", "Lonely": "loneliness", "Angry": "anger", "Exams": "exam_stress", "Relationship": "relationships", "Burnt out": "burnout", "Can't focus": "focus" };
function builtinUnderstand(text, chips, timePref) {

  for (const [th, words] of Object.entries(LEX)) for (const w of words) if (t.includes(norm(w).trim())) scores[th] = (scores[th] || 0) + 1;
  for (const c of chips) { const th = CHIP_THEME[c]; if (th) scores[th] = (scores[th] || 0) + 2; }
  if (scores.focus && scores.exam_stress) scores.exam_stress += 1;
  if (scores.smoking && !/smok|cigar|nicotine|vape/.test(t)) delete scores.smoking;
  const firstPos = th => { let best = 1e9; for (const w of LEX[th] || []) { const i = t.indexOf(norm(w).trim()); if (i >= 0 && i < best) best = i; } return best; };
  const themes = Object.entries(scores).sort((a, b) => b[1] - a[1] || firstPos(a[0]) - firstPos(b[0])).map(e => e[0]).slice(0, 3);

  let severity = "mild";

function timeBudget(time) { return time === "5" ? 5 : time === "15" ? 20 : time === "talk" ? 60 : 20; }
function rank(u, ctx) {

    let th = 0;

    if (th === 0) continue;
    b.fit = th;
    const mins = it.mins;
    if (ctx.time === "talk") b.time = lvl === 3 ? 4 : -1;
    else b.time = mins <= budget ? 1.5 : mins <= budget * 2 ? -1 : -3;
    b.pref = pref && FORMAT[it.type] === pref ? 2 : 0;
    const sev = u.severity;
    b.need = sev === "mild" ? ({ 1: 1, 2: 0, 3: -1 })[lvl] : sev === "moderate" ? ({ 1: .5, 2: 1, 3: .5 })[lvl] : ({ 1: -1, 2: .5, 3: 2.5 })[lvl];
    if (ctx.tier === "amber" && lvl === 3) b.need += 4;
    if (ctx.ladder) b.ladder = lvl >= ctx.ladder ? 1.5 : -2;
    const past = j.filter(e => e.item === it.id);
    if (past.length) {
      const last = past[past.length - 1];
      if (last.outcome === "not_helped") b.history = -4;
      else if (it.type === "assessment" && S.day - last.day < 30) b.history = -3;
      else if (last.outcome === "helped" && it.type === "program") b.history = 1;
      else b.history = -1.5;
    }
    if (p.counsellor && it.type === "session") b.counsellor = 2;
    if (p.homework && it.id === p.homework.id) b.counsellor = (b.counsellor || 0) + 1.5;
    if (ctx.boost && ctx.boost[it.id]) b.signal = ctx.boost[it.id];
    const score = Object.values(b).reduce((a, c) => a + c, 0);
    rows.push({ it, b, score: Math.round(score * 10) / 10 });
  }
  rows.sort((a, b) => b.score - a.score);
  const picks = [];
  for (const r of rows) {
    if (picks.length === 0) { picks.push(r); continue; }
    if (picks.length >= 3) break;

  else if (it.type === "session" && p.counsellor) bits.push(`${p.counsellor.short} already knows what you've been working on`);
  else if (it.type === "chat") bits.push(ctx.time === "talk" ? "You said you'd like to talk to someone" : "Talking it through with a person can help when it's a lot");
  else if (t) bits.push(`You mentioned ${THEMES[t].toLowerCase()}`);
  if (it.type === "assessment") bits.push("a quick check shows where you are and helps a counsellor if you need one later");
  else if (it.type === "program") bits.push(`small daily steps (${it.mins} min a day) work better than one big effort`);
  else if (ctx.time && ctx.time !== "talk" && it.mins <= timeBudget(ctx.time) && LEVEL[it.type] < 3) bits.push(`it takes just ${it.mins} minutes`);
  else if (it.type === "session") bits.push("a full session gives you time to work through it properly");
  return (bits.join(", and ") + ".").replace(/^./, c => c.toUpperCase());
}

async function runCheckin() {

  log(1, "Privacy filter", "rule", red.removed.length ? `Removed ${red.removed.length} personal detail(s) on this device before anything else saw the text.` : "No personal details found.", { sent_text: red.text, removed: red.removed.map(r => r.kind) });
  const sr = safetyRules(ck.text);
  log(2, "Safety rules", "rule", sr.crisisHits.length ? "Crisis words found. Suggestions stopped and human help shown." : sr.concernHits.length ? "Concern words found. The app will ask a safety question." : "No crisis or concern words.", { crisis_words: sr.crisisHits, concern_words: sr.concernHits });
  if (sr.crisisHits.length) {
    S.safety = { tier: "red", source: "rules" };
    addEvent({ kind: "safety", title: "Saathi connected you to human help", human: true });
    await wait(350); S.screen = "crisis"; render(); return;

  let u; const t0 = performance.now(); let mode = "Built-in matcher (no AI)"; let note = "";

    catch (e) { u = builtinUnderstand(red.text, ck.chips); mode = "Built-in matcher (fallback)"; note = `Real AI failed: ${shortErr(e)}. Fell back so the user is not blocked.`; S.flags.fallback = true; }
  } else { u = builtinUnderstand(red.text, ck.chips); await wait(500); }
  if (S.settings.misread && u.themes.length) {
    const wrong = u.themes.includes("relationships") ? "grief" : "relationships";
    u = { ...u, themes: [wrong, ...u.themes.slice(1)] }; u.summary = `You're dealing with ${u.themes.map(x => THEMES[x].toLowerCase()).join(", ").replace(/, ([^,]*)$/, " and $1")}.`; note += " Reviewer toggle: the first theme was swapped for a wrong one on purpose, to show the user correcting it.";
  }
  u.possible_risk = u.possible_risk || sr.concernHits.length > 0;
  log(3, "Understanding", "ai", `${mode}, ${Math.round(performance.now() - t0)} ms. ${note}`.trim(), u);
  S.u = u; S.ctx = { time: ck.time, pref: ck.pref, exclude: [], tier: "green" };
  S.safety = { tier: "green", phq: null, ask: null, answer: null };

}
function shortErr(e) { const m = String(e && (e.message || e)); if (/fetch|network|Failed to|import|CSP|Load failed/i.test(m)) return "could not reach the AI service (network blocked or offline)"; if (/401|auth|api key|x-api-key/i.test(m)) return "API key rejected"; if (/^timed out$/i.test(m)) return "timed out"; return m.slice(0, 120); }
function wait(ms) { return new Promise(r => setTimeout(r, ms)); }
function withTimeout(p, ms) { return Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error("timed out")), ms))]); }

function safetyNeedsQuestion() {
  const s = S.safety, u = S.u;

async function buildRecs(opts = {}) {
  const u = S.u; const ctx = S.ctx;
  const s = S.safety;
  ctx.tier = (s.phq === 3 || u.severity === "high" || s.answer === "unsure") ? "amber" : "green";
  if (!opts.silentLog) log(4, "Safety decision", "rule",
    ctx.tier === "amber" ? "High distress: human support moved to the top. Self-help stays as a backup." : "Low risk: self-help options allowed.",
    { phq2_item_answer: s.phq === null ? "n/a" : ["Not at all", "Several days", "More than half the days", "Nearly every day"][s.phq], safety_question: s.answer || "not asked", tier: ctx.tier });
  const { rows, picks } = rank(u, ctx);
  S.recs = { rows, picks: picks.map(r => ({ ...r, it: displayItem(r.it) })) };
  S.recs.picks.forEach((r, i) => { r.why = templateWhy(r.it, u, i === 0 ? ctx : { ...ctx, reasonLead: null }, r); });
  let whoWrote = "Templates (no AI)";
  if (S.settings.mode === "live" && S.ai.available && !S.settings.outage) {
    try { const map = await withTimeout(liveReasons(u, S.recs.picks.map(r => r.it), { time: ctx.time === "talk" ? "wants to talk to someone" : (ctx.time || "not said") + " minutes", extra: ctx.reasonLead || "" }), 15000);
      for (const r of S.recs.picks) if (map[r.it.id]) r.why = map[r.it.id]; whoWrote = "Real AI (only for the 3 items the rules already chose)"; }
    catch (e) { whoWrote = "Templates (real AI failed: " + shortErr(e) + ")"; }
  }
  log(opts.step || 5, opts.title || "Ranking", "rule", `Scored ${rows.length} catalogue items with fixed rules. Picked the best one, then the best two of other types. Reasons written by: ${whoWrote}.`, { table: rows.slice(0, 8) });
}

function followUp(ans) {
  const f = S.pendingFollow; const it = byId(f.item);
  const j = journey(); const ev = [...j].reverse().find(e => e.item === f.item && e.day === f.day);
  if (ev) { ev.outcome = ans === "lot" ? "helped" : ans === "little" ? "little" : "not_helped"; store.set("saathi.v1.j." + S.pid, j); }
  S.log = [];
  const u = S.u || { themes: it.themes.filter(t => t !== "*").slice(0, 2), duration: "weeks", severity: "moderate", preference: "none", possible_risk: false, summary: "" };
  S.u = { ...u };
  const cur = LEVEL[it.type];
  let ladder, lead, header;
  if (ans === "lot") { ladder = it.type === "program" ? 2 : 2; lead = `Since "${it.title}" helped, this keeps the progress going`; header = "Keep it going"; }
  else if (ans === "little") { ladder = Math.min(cur + 1, 3); lead = `"${it.title}" helped a little, so this goes one step further`; header = "One step further"; }
  else { ladder = 3; S.u.severity = "high"; lead = `"${it.title}" didn't help enough, and that's useful to know. A person can tailor support to you`; header = "Let's try something different"; }
  log(1, "Follow-up answer", "human", `User said: ${({ lot: "Yes, a lot", little: "A little", no: "Not really", worse: "I feel worse" })[ans]}.`, { item: it.title, outcome_saved: ev ? ev.outcome : null });
  log(2, "Follow-up ladder", "rule", `Rule: helped → keep going at the same level or a structured program; a little → one level up; not really or worse → a person. Target level: ${ladder} (1 self-help, 2 self-check or program, 3 person).`, { from_level: cur, target_level: ladder });
  S.ctx = { time: "15", pref: null, exclude: ans === "lot" ? [] : [it.id], tier: "green", ladder, reasonLead: lead, header };
  S.safety = { tier: "green", phq: ans === "worse" || ans === "no" ? 2 : 0, answer: S.followSafe || null };
  S.pendingFollow = null; S.followAns = null; S.followSafe = null;
  addEvent({ kind: "followup", title: `Follow-up: ${it.title}`, detail: ({ lot: "helped a lot", little: "helped a little", no: "didn't help", worse: "felt worse" })[ans], tags: S.u.themes });
  buildRecs({ step: 3, title: "Ranking (with ladder)" }).then(() => { S.screen = "next"; render(); });
}

  if (el.tagName === "INPUT" && el.type === "checkbox" && !["shareCtx", "shareCounsellor", "misread", "outage"].includes(a)) return;
  switch (a) {
    case "persona": S.pid = v; S.screen = "home"; S.ck = null; S.u = null; S.recs = null; S.log = []; S.pendingFollow = null; S.day = 0; render(); break;
    case "nav": if (v === "checkin") S.ck = S.ck && S.screen === "checkin" ? S.ck : freshCheckin(); if (v === "crisis" && S.screen !== "crisis") S.safety = S.safety && S.safety.tier === "red" ? S.safety : { tier: "self" }; S.screen = v; render(); break;
    case "go": if (v === "checkin" && !S.ck) S.ck = freshCheckin(); S.screen = v; render(); break;
    case "example": S.ck.text = persona().example; if (!S.ck.time) S.ck.time = "15"; render(); break;
    case "chip": { const c = S.ck.chips; const i = c.indexOf(v); i >= 0 ? c.splice(i, 1) : c.push(v); render(); break; }
    case "time": S.ck.time = v; render(); break;
    case "pref": S.ck.pref = S.ck.pref === v ? null : v; render(); break;
    case "submitCheckin": runCheckin(); break;
    case "clarifyPick": { const t = S.u.themes; const i = t.indexOf(v); i >= 0 ? t.splice(i, 1) : t.push(v); render(); break; }
    case "clarifyDone": S.u.summary = `You're dealing with ${S.u.themes.map(x => THEMES[x].toLowerCase()).join(", ")}.`; if (S.u.severity === "mild" && S.u.themes.length > 1) S.u.severity = "moderate"; log(3.5, "Clarifying question", "human", "Saathi wasn't sure, so it asked. User picked: " + S.u.themes.map(x => THEMES[x]).join(", "), null); S.screen = "understood"; render(); break;
    case "rmTheme": S.u.themes = S.u.themes.filter(x => x !== v); log(3.5, "User correction", "human", `User removed "${THEMES[v]}".`, null); render(); break;
    case "dur": S.u.duration = v; render(); break;
    case "sev": S.u.severity = v; S.safety.answer = null; render(); break;
    case "phq": S.safety.phq = +v; S.safety.answer = null; render(); break;
    case "safeAns":
      S.safety.answer = v;
      if (v === "yes") { log(4, "Safety decision", "rule", "User answered yes to the safety question. Suggestions stopped; human help shown.", { tier: "red" }); S.safety.tier = "red"; addEvent({ kind: "safety", title: "Saathi connected you to human help", human: true }); S.screen = "crisis"; }
      render(); break;
    case "showNext":
      S.log = S.log.filter(l => l.step < 4);
      addEvent({ kind: "checkin", title: "Check-in", detail: S.u.themes.map(t => THEMES[t]).join(" · "), tags: S.u.themes.slice() });
      S.ctx.header = null; S.fbOpen = false;
      await buildRecs(); S.screen = "next"; render(); break;
    case "fbOpen": S.fbOpen = true; render(); break;
    case "fb": {
      const main = S.recs.picks[0].it;
      const lbl = { long: "Too long", talk: "I'd rather talk to someone", tried: "I've tried this", off: "That's not what I'm dealing with", read: "I'd rather read", watch: "I'd rather watch" }[v];
      if (v === "long") S.ctx.time = "5";
      if (v === "talk") S.ctx.time = "talk";
      if (v === "tried") { S.ctx.exclude.push(main.id); addEvent({ kind: "step", item: main.id, title: main.title, outcome: "not_helped", detail: "said they'd tried it" }); }
      if (v === "off") { S.ctx.exclude.push(main.id); if (S.u.themes.length > 1) S.u.themes.push(S.u.themes.shift()); }
      if (v === "read" || v === "watch") S.ctx.pref = v;
      S.fbOpen = false;
      S.log = S.log.filter(l => l.step < 5);
      log(5, "\"Not quite right\" feedback", "human", `User said: ${lbl}. Ranking re-run with that change.`, { change: v, excluded: S.ctx.exclude, time: S.ctx.time, pref: S.ctx.pref });
      await buildRecs({ step: 6, title: "Ranking (updated)", silentLog: true });
      toast("Updated. Thanks, that helps Saathi learn what suits you."); break;
    }
    case "startItem": startItem(v); break;
    case "backFromDoing": S.screen = S.recs ? "next" : "home"; render(); break;
    case "play": { el.hidden = true; const bar = $("#pbar"); let w = 0; const t = setInterval(() => { w += 10; if (bar) bar.style.width = w + "%"; if (w >= 100) clearInterval(t); }, 250); break; }
    case "aq": { const [q, i] = v.split("-").map(Number); S.aq[q] = i; render(); break; }
    case "slot": S.slot = +v; render(); break;
    case "shareCtx": S.shareCtx = el.checked; break;
    case "shareCounsellor": { const pr = prefs(); pr.shareWithCounsellor = el.checked; setPrefs(pr); toast(el.checked ? `Sharing on. ${persona().counsellor.short} will see your Saathi summary.` : "Sharing off."); break; }
    case "finishItem": finishItem(); break;
    case "skip3": S.day += 3; S.screen = "home"; render(); toast("3 days later…"); break;
    case "follow": S.followAns = v; if (v !== "worse") followUp(v); else render(); break;
    case "followSafe": if (v === "yes") { S.safety = { tier: "red" }; S.pendingFollow = null; addEvent({ kind: "safety", title: "Saathi connected you to human help", human: true }); S.screen = "crisis"; render(); } else { S.followSafe = v; followUp("worse"); } break;
    case "signalRec": signalRec(); break;
    case "midweek": midweek(v); break;
    case "mwSafe": mwSafe(v); break;
    case "copy": try { await navigator.clipboard.writeText(v); toast("Copied " + v); } catch (err) { toast("Number: " + v); } break;
    case "askDel": S.confirmDel = true; render(); break;
    case "cancelDel": S.confirmDel = false; render(); break;
    case "delAll": store.set("saathi.v1.j." + S.pid, []); S.confirmDel = false; S.pendingFollow = null; render(); toast("Deleted. Saathi no longer remembers anything about you."); break;
    case "closePanel": S.panelOpen = false; render(); break;
    case "mode": S.settings.mode = el.value; renderPanel(); break;
    case "misread": S.settings.misread = el.checked; break;
    case "outage": S.settings.outage = el.checked; break;
    case "test": S.panelOpen = window.innerWidth > 860; startCheckinWith(EXAMPLES[v], v === "high" ? "15" : "15"); break;
  }
});
$("#panelBtn").addEventListener("click", () => { S.panelOpen = !S.panelOpen; render(); });
$("#resetBtn").addEventListener("click", () => { Object.keys(PERSONAS).forEach(k => { store.del("saathi.v1.j." + k); store.del("saathi.v1.p." + k); }); Object.assign(S, { screen: "home", day: 0, ck: null, u: null, recs: null, log: [], pendingFollow: null, current: null }); render(); toast("Demo reset."); });
render();
probeAI();
</script>
